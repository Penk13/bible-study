<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111113">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Life-Study of the Bible — Study Guides</title>
  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>

  <main class="study-shell">
    <header class="index-header">
      <div class="series-badge">Life-Study of the Bible</div>
      <h1>Life-Study Review Guides</h1>
      <p class="summary-dek">Mobile-first visual outlines and review companions for the Life-Study of the Bible by Witness Lee.</p>
    </header>

    <div class="search-bar">
      <input type="search" id="filter-input" class="search-input" placeholder="🔍 Search books (e.g. 'Romans', 'Hebrews')..." autocomplete="off">
    </div>

    <div class="message-list" id="message-list">
      <a href="life-study-of-romans/index.html" class="msg-card">
        <div class="msg-title-group">
          <span class="msg-num">ROM</span>
          <span class="msg-title">Life-Study of Romans</span>
        </div>
        <span class="msg-arrow">›</span>
      </a>

      <a href="life-study-of-hebrews/index.html" class="msg-card">
        <div class="msg-title-group">
          <span class="msg-num">HEB</span>
          <span class="msg-title">Life-Study of Hebrews</span>
        </div>
        <span class="msg-arrow">›</span>
      </a>
    </div>

    <div class="no-results" id="no-results">
      No books match your search.
    </div>
  </main>

  <script>
    const filterInput = document.getElementById('filter-input');
    const msgCards = document.querySelectorAll('.msg-card');
    const noResults = document.getElementById('no-results');

    filterInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      let visibleCount = 0;

      msgCards.forEach(card => {
        const text = card.textContent.toLowerCase();
        if (text.includes(q)) {
          card.style.display = 'flex';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });

      noResults.style.display = visibleCount === 0 ? 'block' : 'none';
    });
  </script>
</body>
</html>
