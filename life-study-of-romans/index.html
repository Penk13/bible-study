<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111113">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Life-Study of Romans — Study Guide</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>

  <nav class="top-nav" aria-label="Main Navigation">
    <a href="../index.html"><strong>← All Books</strong></a>
    <span class="series-badge" style="margin-bottom:0">Romans</span>
  </nav>

  <main class="study-shell">
    <header class="index-header">
      <div class="series-badge">Life-Study of the Bible</div>
      <h1>Life-Study of Romans</h1>
      <p class="summary-dek">Review notes and visual outlines for the Life-Study of Romans by Witness Lee.</p>
    </header>

    <div class="search-bar">
      <input type="search" id="filter-input" class="search-input" placeholder="🔍 Search messages (e.g. 'Gospel', '001')..." autocomplete="off">
    </div>

    <div class="message-list" id="message-list">
      <a href="001-A-Foreword.html" class="msg-card">
        <div class="msg-title-group">
          <span class="msg-num">001</span>
          <span class="msg-title">A Foreword</span>
        </div>
        <span class="msg-arrow">›</span>
      </a>

      <a href="002-The-Gospel-of-God.html" class="msg-card">
        <div class="msg-title-group">
          <span class="msg-num">002</span>
          <span class="msg-title">The Gospel of God</span>
        </div>
        <span class="msg-arrow">›</span>
      </a>
    </div>

    <div class="no-results" id="no-results">
      No messages match your search.
    </div>
  </main>

  <script>
    const filterInput = document.getElementById('filter-input');
    const msgCards = document.querySelectorAll('.msg-card');
    const noResults = document.getElementById('no-results');

    filterInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      let visibleCount = 0;

      msgCards.forEach(card => {
        const text = card.textContent.toLowerCase();
        if (text.includes(q)) {
          card.style.display = 'flex';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });

      noResults.style.display = visibleCount === 0 ? 'block' : 'none';
    });
  </script>
</body>
</html>
